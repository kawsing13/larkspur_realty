# Local development services. Nothing here is used in production as-is.
#   db      -> PostgreSQL, the application database
#   storage -> MinIO, an S3-compatible object store for property images and documents
#              (only needed from Phase 7 onward, but harmless to run now)
#
#   start:  docker compose up -d
#   stop:   docker compose down
#   wipe:   docker compose down -v   (also deletes the volumes / all local data)

services:
  db:
    image: postgres:16-alpine
    container_name: rems_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rems
      POSTGRES_PASSWORD: rems_dev_pw
      POSTGRES_DB: rems
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rems -d rems"]
      interval: 5s
      timeout: 5s
      retries: 12

  storage:
    image: minio/minio:latest
    container_name: rems_storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rems
      MINIO_ROOT_PASSWORD: rems_dev_pw
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console at http://localhost:9001
    volumes:
      - storage_data:/data

volumes:
  db_data:
  storage_data:

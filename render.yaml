# Render blueprint - provisions the whole stack from this repo.
#
# What it creates:
#   larkspur-db    managed PostgreSQL 16
#   larkspur-api   the Express API (built from server/Dockerfile)
#   larkspur-web   the built React SPA, served as a static site
#
# This deploy runs WITHOUT object storage (STORAGE_PROVIDER=none). Browsing works
# from the seeded demo photos (committed under client/public/demo/); the agent
# "upload photo" and property-document endpoints return 501. To enable real
# uploads later, switch STORAGE_PROVIDER to "s3" and add the STORAGE_* values for
# a bucket provider - see docs/DEPLOYMENT.md.
#
# First run:
#   1. In Render: New -> Blueprint -> pick this repo. It reads this file.
#   2. After the first deploy, set the two cross-reference URLs (CLIENT_ORIGIN on
#      the API, VITE_API_BASE_URL on the web service) and redeploy the web service.
#   3. Open the API service shell and run:
#        node server/prisma/scripts/seed-rbac.js
#        node server/prisma/scripts/create-admin.js you@example.com "a strong password" Ada Lovelace
#      Optionally load the demo listings:  npm run db:seed --workspace server
#      (migrations run automatically on every deploy - see dockerCommand.)

databases:
  - name: larkspur-db
    databaseName: larkspur
    user: larkspur
    region: oregon # must match larkspur-api so they share the internal network
    plan: free # free Postgres is deleted after 30 days - bump to "basic-256mb" for anything real

services:
  # ---- API (Express) -------------------------------------------------------
  - type: web
    name: larkspur-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: . # the Dockerfile needs the repo root (shared npm lockfile)
    plan: free
    region: oregon
    healthCheckPath: /health
    # Apply pending migrations, then start the server. Runs on every deploy;
    # `migrate deploy` is a no-op when nothing is pending. Kept here (not in the
    # Dockerfile) because docker-compose.prod.yml has its own migrate step.
    dockerCommand: sh -c "npm run db:deploy --workspace server && node server/src/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: larkspur-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "7"
      # Render puts exactly one proxy in front of the service.
      - key: TRUST_PROXY
        value: "1"
      # API and web are on different onrender.com subdomains, so the refresh
      # cookie is cross-site and must be SameSite=None (it is Secure automatically
      # in production).
      - key: COOKIE_SAMESITE
        value: none
      - key: ENABLE_API_DOCS
        value: "false"
      # The web app's origin, for CORS. After the first deploy, set this to the
      # full URL of larkspur-web, e.g. https://larkspur-web.onrender.com
      - key: CLIENT_ORIGIN
        sync: false
      # No object storage in this deploy. See the header comment.
      - key: STORAGE_PROVIDER
        value: none
      # Optional: paste a Mapbox token to get the interactive map on listings.
      - key: MAPBOX_TOKEN
        value: ""

  # ---- Frontend (static SPA) --------------------------------------------------
  - type: web
    name: larkspur-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./client/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Absolute URL of the API, including /api. After the first deploy set this
      # to e.g. https://larkspur-api.onrender.com/api  (a rebuild is needed for
      # Vite to bake it in).
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # SPA: every unknown path serves index.html so React Router can handle it.
      - type: rewrite
        source: /*
        destination: /index.html
